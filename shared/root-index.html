<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa Sanitário e HHFA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fdfdfb; --fg: #1f2a33; --muted: #5b6b77; --card: #fff; --border: #d8e0e6; --accent: #0b6e99; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16191d; --fg: #dfe3e7; --muted: #9aa6b0; --card: #1e2329; --border: #333c46; --accent: #5fb3d9; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         background: var(--bg); color: var(--fg); font-family: "Source Sans 3", system-ui, sans-serif; }
  main { max-width: 760px; width: 100%; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  a.card { display: block; padding: 24px; border: 1px solid var(--border); border-left: 6px solid var(--accent);
           border-radius: 8px; background: var(--card); color: inherit; text-decoration: none; }
  a.card:hover { border-color: var(--accent); }
  .lang { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); font-weight: 700; }
  h2 { font-size: 1.25rem; line-height: 1.3; margin: .4rem 0 0; }
</style>
</head>
<body>
<main>
  <div class="grid">
    <a class="card" href="pt/" hreflang="pt">
      <div class="lang">Português</div>
      <h2>Análise comparativa entre o Mapa Sanitário do MINSA e o Harmonized Health Facility Assessment</h2>
    </a>
    <a class="card" href="en/" hreflang="en">
      <div class="lang">English</div>
      <h2>Comparative analysis of the MINSA Health Map and the Harmonized Health Facility Assessment</h2>
    </a>
  </div>
</main>
</body>
</html>
