<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<script>
  // Apply the reader's saved typeface and size before the page paints.
  (function () {
    try {
      var d = document.documentElement;
      var f = localStorage.getItem("reader-font");
      var s = localStorage.getItem("reader-fontsize");
      if (f && f !== "sans") d.setAttribute("data-font", f);
      if (s && s !== "0") d.setAttribute("data-fontsize", s);
    } catch (e) {}
  })();
</script>
